name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/smart-grocery-saver/scripts/grocery_saver.py plan -i skills/smart-grocery-saver/examples/family_of_three.json -f summary
      - run: python tools/package_skill.py
